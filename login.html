<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 · 샐비어 캘린더</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div class="band">
    <div class="wrap">
      <header class="top">
        <a class="logo" href="index.html"><img src="logo.png" alt="교표" style="width:40px;height:40px;object-fit:contain;border-radius:50%;background:#fff;vertical-align:middle;margin-right:8px">샐비어 캘린더</a>
        <a class="pill" href="index.html">사이트로 돌아가기</a>
      </header>
    </div>
  </div>

  <main class="wrap narrow">
    <section class="card">
      <div class="tabs" role="group" aria-label="로그인 또는 가입">
        <button type="button" data-tab="login" aria-pressed="true">로그인</button>
        <button type="button" data-tab="signup" aria-pressed="false">가입하고 신청하기</button>
      </div>

      <form id="login-form" class="form">
        <h2>관리자 로그인</h2>
        <p id="login-msg" class="msg" role="alert"></p>
        <label for="li-id">아이디</label>
        <input id="li-id" name="userId" autocomplete="username" required placeholder="예: 2-7">
        <label for="li-pw">비밀번호</label>
        <input id="li-pw" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn">로그인</button>
      </form>

      <form id="signup-form" class="form" hidden>
        <h2>입력 담당 신청</h2>
        <p>가입하면 선생님이 승인한 뒤부터 글을 올릴 수 있어요.</p>
        <p id="signup-msg" class="msg" role="status"></p>
        <label for="su-name">이름</label>
        <input id="su-name" name="name" required>
        <div class="row2">
          <div>
            <label for="su-grade">학년</label>
            <select id="su-grade" name="grade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select>
          </div>
          <div>
            <label for="su-cls">반</label>
            <select id="su-cls" name="cls"></select>
          </div>
        </div>
        <label for="su-id">아이디 (영어·숫자·-)</label>
        <input id="su-id" name="userId" autocomplete="username" required placeholder="예: 2-7">
        <label for="su-pw">비밀번호 (8자 이상)</label>
        <input id="su-pw" name="password" type="password" autocomplete="new-password" required>
        <button type="submit" class="btn">가입하고 신청하기</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
